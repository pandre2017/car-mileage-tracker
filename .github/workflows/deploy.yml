name: Deploy backend manually
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm test
        working-directory: backend
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud run deploy mileage-api --source backend --project "$GCP_PROJECT" --region "$GCP_REGION" \
            --service-account "$RUNTIME_ACCOUNT" --allow-unauthenticated \
            --min-instances 0 --max-instances 2 --cpu 1 --memory 512Mi \
            --set-env-vars "GCLOUD_PROJECT=$GCP_PROJECT" --quiet
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
